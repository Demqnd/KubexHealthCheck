name: Good Morning Message

on:
  schedule:
    - cron: "0 13 * * *" # 9am US Eastern (adjust as needed) — runs daily
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, no waiting for the schedule

jobs:
  good-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build backend
        working-directory: backend
        run: go build -o kubexhealthcheck .

      - name: Start backend
        working-directory: backend
        env:
          ASPNETCORE_URLS: http://localhost:5000
          ASPNETCORE_ENVIRONMENT: Production
          ApiKeySettings__Key: ${{ secrets.API_KEY }}
          ClaudeApiSettings__ApiKey: ${{ secrets.CLAUDE_API_KEY }}
          KubexMcpSettings__AuthorizationToken: ${{ secrets.KUBEX_MCP_TOKEN }}
        run: |
          nohup ./kubexhealthcheck > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -H "X-Api-Key: ${{ secrets.API_KEY }}" http://localhost:5000/api/webhook > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start in time"
          cat backend.log
          exit 1

      - name: Configure webhook URL
        run: |
          curl -sf -X PUT http://localhost:5000/api/webhook \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.API_KEY }}" \
            -d "{\"url\": \"${{ secrets.TEAMS_WEBHOOK_URL }}\"}"

      - name: Send good morning message
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST http://localhost:5000/api/claude/command \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.API_KEY }}" \
            -d "{\"command\": \"Good morning! Tell me something new that most people don not know.\"}")
          echo "Response body:"
          cat response.json
          if [ "$status" -ge 400 ]; then
            echo "Send failed with HTTP $status"
            exit 1
          fi

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
